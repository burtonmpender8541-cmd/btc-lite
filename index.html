const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
const sd=a=>Math.sqrt(a.reduce((s,v)=>s+(v-mean(a))**2,0)/(a.length-1));

for(let k of [10,20,60,120]){x['volatility_'+k]=sd(tail(r,k));x['fvolatility_'+k]=sd(tail(q,k));let sum=a=>tail(a,k).reduce((z,v)=>z+v[7],0);x['turnover_ratio_'+k]=Math.log((sum(f)+1)/(sum(s)+1));for(let [n,a] of [['spot',s],['swap',f]]){let v=tail(a,k).map(z=>Math.log1p(z[7]));x[n+'_volume_z_'+k]=(last(v)-mean(v))/(sd(v)+1e-9)}x['range_'+k]=Math.max(...tail(s,k).map(a=>a[2]))/Math.min(...tail(s,k).map(a=>a[3]))-1}
let [t,o,h,l,cl]=last(s);x.body=(cl-o)/o;x.range=(h-l)/o;x.upper_wick=(h-Math.max(o,cl))/o;x.lower_wick=(Math.min(o,cl)-l)/o;for(let k of [14,30]){let a=tail(r,k),g=mean(a.map(v=>Math.max(v,0))),loss=mean(a.map(v=>Math.max(-v,0)));x['rsi_'+k]=g/(g+loss+1e-12)}return MODEL.features.map(k=>Math.fround(x[k]));}

function save(){try{localStorage.setItem(KEY,JSON.stringify(logs))}catch(e){storageOK=false}}
function record(h,entry,p,signal){if(signal==='观望'||Date.now()>=entry||!storageOK)return;if(logs.some(r=>r.h===h&&Math.abs(r.entry-entry)<(h+2)*60000))return;logs.push({h,entry,end:entry+h*60000,p,signal,status:'待结算'});save()}
function render(){let lines=[];for(let h of [30,60]){let a=logs.filter(r=>r.h===h),b=a.filter(r=>['赢','输','平'].includes(r.status)),w=b.filter(r=>r.status==='赢').length,l=b.filter(r=>r.status==='输').length;let pnl=.85*w-l;let eq=0,peak=0,dd=0,streak=0,maxstreak=0;for(let r of b.sort((a,b)=>a.end-b.end)){eq+=r.status==='赢'?.85:r.status==='输'?-1:0;peak=Math.max(peak,eq);dd=Math.max(dd,peak-eq);streak=r.status==='输'?streak+1:0;maxstreak=Math.max(maxstreak,streak)}lines.push(`${h}分钟：已结算 ${b.length}，待结算 ${a.length-b.length}\n胜率 ${w+l?(100*w/(w+l)).toFixed(2)+'%':'--'}，净收益 ${pnl.toFixed(2)}U\n每笔平均 ${b.length?(pnl/b.length).toFixed(4):'--'}U，最大回撤 ${dd.toFixed(2)}U，最长连亏 ${maxstreak}`)}document.getElementById('stats').textContent=lines.join('\n\n')+(storageOK?'':'\n本地存储不可用，记录可能丢失');document.getElementById('history').textContent=logs.slice(-30).reverse().map(r=>`${new Date(r.entry).toLocaleString()} · ${r.h}分钟 · ${r.signal} · ${r.status}`).join('\n')||'暂无有效信号'}
async function price(t){let u='https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1m&startTime='+t+'&limit=1';let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let a=await r.json();if(!Array.isArray(a)||Number(a[0]?.[0])!==t||!(Number(a[0][1])>0))throw Error('价格缺失');return Number(a[0][1])}
let settling=false;async function settle(){if(settling)return;settling=true;try{for(let r of logs.filter(r=>r.status==='待结算'&&Date.now()>=r.end+60000)){try{let [a,b]=await Promise.all([price(r.entry),price(r.end)]);r.open=a;r.close=b;r.status=a===b?'平':((b>a)===(r.signal==='上涨信号')?'赢':'输');save()}catch(e){document.getElementById('settleStatus').textContent='币安结算暂不可用：'+e.message;break}}}finally{settling=false;render()}}
function exportLog(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(logs,null,2)],{type:'application/json'}));a.download='btc-lite-paper.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
let lastMinute=-1;setInterval(()=>{let m=Math.floor(Date.now()/60000);if(!document.hidden&&document.getElementById('auto').checked&&m!==lastMinute&&Date.now()%60000>8000){lastMinute=m;refresh()}},3000);render();settle();
</script></html>
